
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          cmdline-tools-version: 15859902

      - name: Install Android packages
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

          echo "Android packages installed"

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Install Android templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          mkdir -p templates
          unzip -q Godot_v4.3-stable_export_templates.tpz -d templates

          mkdir -p ~/.local/share/godot/export_templates/4.3.stable

          cp templates/templates/android_debug.apk \
            ~/.local/share/godot/export_templates/4.3.stable/

          cp templates/templates/android_release.apk \
            ~/.local/share/godot/export_templates/4.3.stable/

          ls -lh ~/.local/share/godot/export_templates/4.3.stable/

      - name: Extract game ZIP
        shell: bash
        run: |
          set -e

          test -f Frontline_Online_Godot4_Android_Starter.zip

          mkdir -p extracted
          unzip -o Frontline_Online_Godot4_Android_Starter.zip -d extracted

          PROJECT_FILE=$(find extracted -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Create debug key
        run: |
          mkdir -p ~/.android

          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Create Android export preset
        shell: bash
        run: |
          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Frontline.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true

          version/code=1
          version/name="1.0"

          package/unique_name="com.frontline.online"
          package/name="Frontline Online"
          package/signed=true
          package/retain_data_on_uninstall=false
          package/allow_backup=true
          EOF

      - name: Configure Godot Android SDK
        shell: bash
        run: |
          mkdir -p ~/.config/godot

          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "SDK: $ANDROID_HOME"
          echo "Java: $JAVA_HOME"

      - name: Import project
        run: |
          ./Godot_v4.3-stable_linux.x86_64 \
            --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit

      - name: Build APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/build"

          ./Godot_v4.3-stable_linux.x86_64 \
            --headless \
            --verbose \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/Frontline.apk"

          test -s "$PROJECT_DIR/build/Frontline.apk"

          echo "APK successfully created!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frontline-Android-APK
          path: extracted/**/build/Frontline.apk
          if-no-files-found: error
